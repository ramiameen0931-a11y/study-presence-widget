<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Presence</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 8px;
    }
    .widget {
      width: min(100%, 520px);
      padding: 18px 22px;
      border: 1px solid rgba(127,127,127,.18);
      border-radius: 14px;
      background: rgba(255,255,255,.96);
      text-align: center;
      box-shadow: 0 3px 14px rgba(0,0,0,.045);
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 17px;
      font-weight: 650;
      color: #252525;
      line-height: 1.35;
    }
    .dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 0 4px rgba(52,199,89,.12);
    }
    .tagline {
      margin-top: 5px;
      font-size: 13px;
      font-style: italic;
      color: #8a8a8a;
    }
    #count { font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      .widget {
        background: rgba(32,32,32,.96);
        border-color: rgba(255,255,255,.12);
      }
      .status { color: #f1f1f1; }
      .tagline { color: #a9a9a9; }
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      <span><strong id="count">1</strong> <span id="people">person</span> studying right now</span>
    </div>
    <div class="tagline">you're not suffering alone</div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // STEP 1: Replace BOTH values below with your Supabase project details.
    // Use the Project URL and PUBLISHABLE key from Supabase's Connect dialog.
    const SUPABASE_URL = 'https://ruzkvovjysgighpmsswc.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_sVPcCpQ--Xp_jVSbX2S9Yg_gHETtW-r';

    const countEl = document.getElementById('count');
    const peopleEl = document.getElementById('people');

    function showCount(count) {
      const safeCount = Math.max(1, count);
      countEl.textContent = safeCount;
      peopleEl.textContent = safeCount === 1 ? 'person' : 'people';
    }

    if (
      SUPABASE_URL.includes('PASTE_') ||
      SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')
    ) {
      console.warn('Add your Supabase URL and publishable key to index.html.');
      showCount(1);
    } else {
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false }
      });

      const visitorId =
        (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);

      const channel = supabase.channel('study-room', {
        config: {
          presence: { key: visitorId }
        }
      });

      function refreshCount() {
        const state = channel.presenceState();
        // Each unique browser tab has its own presence key.
        const count = Object.keys(state).length;
        showCount(count);
      }

      channel
        .on('presence', { event: 'sync' }, refreshCount)
        .on('presence', { event: 'join' }, refreshCount)
        .on('presence', { event: 'leave' }, refreshCount)
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await channel.track({
              online_at: new Date().toISOString()
            });
          }
        });

      // Best-effort cleanup. Supabase also detects disconnected clients.
      window.addEventListener('pagehide', () => {
        channel.untrack();
      });
    }
  </script>
</body>
</html>
