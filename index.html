<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Presence</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 4px;
      overflow: hidden;
    }

    .presence {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 7px 12px;
      border-radius: 10px;
      background: rgba(38, 38, 38, 0.92);
      box-shadow: 0 1px 2px rgba(0,0,0,.12);
      color: rgba(255,255,255,.88);
      white-space: nowrap;
      font-size: 14px;
      line-height: 1.3;
    }

    .dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 999px;
      background: #34c759;
      box-shadow: 0 0 0 3px rgba(52,199,89,.13);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .main {
      font-weight: 500;
    }

    #count {
      color: #fff;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .separator {
      color: rgba(255,255,255,.30);
    }

    .tagline {
      color: rgba(255,255,255,.52);
      font-style: italic;
      font-weight: 400;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .58; transform: scale(.92); }
    }

    @media (max-width: 430px) {
      .presence {
        max-width: calc(100vw - 8px);
        font-size: 13px;
        gap: 6px;
        padding: 7px 10px;
      }
      .tagline {
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body>
  <div class="presence">
    <span class="dot" aria-hidden="true"></span>
    <span class="main"><span id="count">1</span> <span id="people">person</span> studying right now</span>
    <span class="separator">·</span>
    <span class="tagline">you're not suffering alone</span>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://ruzkvovjysgighpmsswc.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_sVPcCpQ--Xp_jVSbX2S9Yg_gHETtW-r';

    const countEl = document.getElementById('count');
    const peopleEl = document.getElementById('people');

    function showCount(count) {
      const safeCount = Math.max(1, count);
      countEl.textContent = safeCount;
      peopleEl.textContent = safeCount === 1 ? 'person' : 'people';
    }

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });

    const visitorId =
      crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

    const channel = supabase.channel('study-room', {
      config: { presence: { key: visitorId } }
    });

    function refreshCount() {
      showCount(Object.keys(channel.presenceState()).length);
    }

    channel
      .on('presence', { event: 'sync' }, refreshCount)
      .on('presence', { event: 'join' }, refreshCount)
      .on('presence', { event: 'leave' }, refreshCount)
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await channel.track({ online_at: new Date().toISOString() });
        }
      });

    window.addEventListener('pagehide', () => channel.untrack());
  </script>
</body>
</html>
